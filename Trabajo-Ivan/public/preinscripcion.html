<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preinscripcion</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div id="error" class="pop"></div>
    <header>
        <h1>Home de mi sitio</h1>
    </header>
    <nav>
        <div id="btnHome">Home</div>
        <div id="btnPre">preinscripcion</div>
    </nav>
    <main>
        <form action="/preinscripcion">
        <span>Curso</span>
        <select name="curso" id="selectCurso">
            <option value="">Programacion Web</option>
            <option value="">Reparacion de PC</option>
        </select>
        <span>Sede</span>
        <select name="sede" id="selectSede">
            <option value="">San Miguel</option>
            <option value="">San Martin</option>
        </select>
        <input type="text" name="nombre" id="nombre" placeholder="Nombre"> 
        <input type="text" name="dni" id="dni" placeholder="DNI"> 
        <input type="text" name="telefono" id="telefono" placeholder="Telefono"> 
        <input type="submit" value="Ingresar datos">
    </form>
    </main>
    <footer>
        <span>hecho por Ivan Leiva &copy;2025</span>    
    <script src="script/preinscripcion.js"></script>
</body>
</html>
