<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de JS</title>
    <link rel="stylesheet" href="estilo/estilo2.css">
</head>

<body>
    <div class="caja" id="cajaSaludo">
        <h1>Saludo Personalizado</h1>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">
        <span>
            <button id="saludar" class="boton">Saludar</button>
            <p id="mensaje" class="mensaje1">...respuesta</p>
        </span>
    </div>

    <div class="caja" id="ingredientes">
        <h1>Calculadora de ingredientes</h1>
        <span id="cantidad">
            <span>receta por persona</span>
            <span>500 grms de papas</span>
            <span>100 ml de leche</span>
            <span>30 grms de manteca</span>
            <span>1 huevo</span>
        </span>
        <input type="text">
        <span>
            <button type="text" class="boton" id="calcularIngredientes">Calcular</button>
            <!-- <p id="resultado" id="mensaje2"></p> -->
        </span>
        
    </div>

    <div class="caja" id="listaAsistencia">
        <h1>Lista de Asistencia</h1>
        <input type="text" id="asistentes" placeholder="Ingrese un nombre">
        <span>
            <button id="agregar" class="boton">Agregar</button>
            <button id="ver" class="boton">Ver</button>
            <p id="mensaje1" class="mensaje1"></p>
        </span>
    </div>

    <div class="caja" id="carritoCompras">
        <h1>Carrito de compras</h1>
        <div>Carrito: <span id="cantidadCarrito">0</span></div>
        <div id="botonesCarrito">
            <span>
                <p>Remera Roja <br> 15000</p>
                <button class="agregar" data-producto="remera roja" data-index="0">Agregar</button>
            </span>
            <span>
                <p>Remera Verde <br> 20000</p>
                <button class="agregar" data-producto="remera verde" data-index="1">Agregar</button>
            </span>
            <span>
                <p>Remera Azul <br> 17000</p>
                <button class="agregar" data-producto="remera azul" data-index="2">Agregar</button>
            </span>
        </div>
        <span id="respuestaCarrito">
            <button id="ver">Ver</button>
            <button id="vaciar">Vaciar</button>
            <p id="mensaje">...Respuesta</p>
        </span>
    </div>

    <script src="script/script2.js"></script>
</body>

</html>
