<!DOCTYPE html>

<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas de Datos</title>
    <link rel="stylesheet" href="Estilo/fichas.css">
</head>

<body>
    <h1>Fichas de Datos</h1>
    <div id="formulario" class="caja">
        <span id="padreInputs">
                <input id="nombre" class="input" placeholder="nombre"></input>
                <input id="apellido" class="input" placeholder="apellido"></input>
                <input id="telefono" class="input" placeholder="telefono"></input>
        </span>
        <span id="botonesFormulario">
            <div class="btn" id="registrar">Registrar</div>
        </span>
    </div>
    <div id="vista" class="caja">
        <h2>Registros <span></span></h2>
        <span id="botonesReg">
            <div class="btn" id="mostrarReg">Mostrar</div>
            <div class="btn" id="vaciarReg">Vaciar</div>
        </span>
        <div id="salida" class="salida"></div>
    </div>
    <div id="errores"></div>
    <script src="Script/Fichas.js"></script>

</body>

</html>
